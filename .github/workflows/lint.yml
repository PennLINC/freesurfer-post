name: Contribution checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep this pin in sync with pyproject.toml and .pre-commit-config.yaml.
      - name: Check lint
        run: pipx run --spec ruff==0.16.1 ruff check .
      - name: Check formatting
        run: pipx run --spec ruff==0.16.1 ruff format --diff .

  codespell:
    name: Check spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: codespell-project/actions-codespell@v2
