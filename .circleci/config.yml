version: 2.1

# Dynamic configuration keeps documentation-only updates from spending credits
# on dependency installation or the FreeSurfer container build. The actual
# jobs live in continue_config.yml.
setup: true

orbs:
  path-filtering: circleci/path-filtering@2

workflows:
  setup:
    jobs:
      - path-filtering/filter:
          base-revision: main
          config-path: .circleci/continue_config.yml
          # Tag pushes have no diff for the path filter to inspect, but must
          # still continue so that the release workflow can run.
          filters:
            tags:
              only: /.*/
          mapping: |
            .*                    has_any_changes   true
            freesurfer_post/.*    has_code_changes  true
            tests/.*              has_code_changes  true
            docker/.*             has_code_changes  true
            Dockerfile            has_code_changes  true
            \.dockerignore        has_code_changes  true
            pyproject\.toml       has_code_changes  true
            pixi\.lock            has_code_changes  true
            tox\.ini              has_code_changes  true
            Makefile              has_code_changes  true
            \.circleci/.*         has_code_changes  true
